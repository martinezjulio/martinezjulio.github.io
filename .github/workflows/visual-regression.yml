name: Visual regression checks

on:
  pull_request:
    branches: [main, master, v1.0-dev]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_bibliography/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
  push:
    branches: [v1.0-dev]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_bibliography/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Install Jupyter + ImageMagick runtime deps 🧰
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick python3-pip
          pip3 install --user jupyter nbconvert

      - name: Install Playwright browser 🧪
        run: npx playwright install --with-deps chromium webkit

      # The stock-al-folio baseline parity suite was retired (this site
      # intentionally diverges from upstream); only interaction/stability
      # visual tests run here.
      - name: Run visual checks 👀
        env:
          NO_WEBSERVER: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          (bundle exec jekyll serve --host 127.0.0.1 --port 4000 --baseurl /al-folio --quiet > /tmp/jekyll-candidate.log 2>&1) &
          CANDIDATE_PID=$!

          cleanup() {
            kill "$CANDIDATE_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=0
          for _ in {1..150}; do
            if curl -fsS http://127.0.0.1:4000/al-folio/ >/dev/null; then
              READY=1
              break
            fi

            if ! kill -0 "$CANDIDATE_PID" >/dev/null 2>&1; then
              echo "Jekyll server exited before becoming ready."
              echo "--- candidate log ---"
              cat /tmp/jekyll-candidate.log || true
              exit 1
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Timed out waiting for Jekyll server (5 minutes)."
            echo "--- candidate log ---"
            cat /tmp/jekyll-candidate.log || true
            exit 1
          fi

          npm run test:visual -- --reporter=line

      - name: Upload Playwright report 📄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Jekyll logs 📄
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-visual-logs
          path: |
            /tmp/jekyll-candidate.log
          if-no-files-found: ignore
